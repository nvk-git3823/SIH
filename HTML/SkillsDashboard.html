<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Skills Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../CSS/SkillsDashboard.css">
    <script src="../JS/Dashboard.js" defer></script>
    <script src="../JS/SkillsDashboard.js" defer></script>
</head>

<body>

    <!-- =========================
         TOP NAVIGATION
    ========================== -->

        

<div id="TopNav">

        <div class="nav-brand">
            <button
            type="button"
            class="DashboardButtons"
            id="ProfileButton"
            onclick='window.location.href="../HTML/Profile.html"'
        >
            <img src="../profilepic" id="ProfilePic">

            <span id="Username"></span>
        </button>
        
        
             <button
                type="button"
                class="DashboardButtons"
                id="HomeButton"
                onclick='window.location.href="../HTML/Dashboard.html"'>
                <span class="button-icon">⌂</span>
                <span>Home</span>
            </button>
            <button type="button" class="DashboardButtons nav-home" id="SkillsButton" onclick='window.location.href="../HTML/SkillsDashboard.html"'> <span
                class="nav-icon">      </span> <span> Skills </span> </button>
   </div>

        <div class="nav-actions">
          

            <button
                type="button"
                class="DashboardButtons"
                id="SignOutButton"
                onclick="SignOut()">
                <span class="button-icon">↪</span>
                <span>Sign Out</span>
            </button>

        </div>

    </div>

    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main id="Content">


        <!-- Header -->

        <section class="DashboardHeader">

            <div>

                <div class="SmallTitle">
                    <span class="TitleDot"></span>
                    SKILLS OVERVIEW
                </div>

                <h1>Your Skills</h1>

                <p>
                    Track your technical abilities and showcase
                    what you can do.
                </p>

            </div>


            <div class="SkillSummary">

                <div class="SummaryNumber" id="SkillCount">
                    0
                </div>

                <div class="SummaryText">
                    Skills
                </div>

            </div>

        </section>



        <!-- Search -->

        <section class="SearchSection">

            <div class="SearchBox">

                <span class="SearchIcon">⌕</span>

                <input
                    type="text"
                    id="SkillSearch"
                    placeholder="Search skills..."
                    autocomplete="off"
                >

            </div>


            <div class="FilterButtons">

    <button class="FilterButton active" data-filter="all">
        All
    </button>

    <button class="FilterButton" data-filter="technical">
        Technical
    </button>

    <button class="FilterButton" data-filter="design">
        Design
    </button>

    <button class="FilterButton" data-filter="data">
        Data
    </button>

    <button class="FilterButton" data-filter="ai">
        AI
    </button>

    <button class="FilterButton" data-filter="support">
        IT & Support
    </button>

    <button class="FilterButton" data-filter="professional">
        Professional
    </button>

    <button class="FilterButton" data-filter="soft">
        Soft Skills
    </button>

</div>

        </section>



        <!-- Skill Cards -->

        <section id="SkillsGrid">

            <!-- Skills will be generated by JavaScript -->

        </section>



        <!-- Empty State -->

        <div id="NoSkills">

            <div class="EmptyIcon">
                ✦
            </div>

            <h2>No skills found</h2>

            <p>
                Try searching for another skill.
            </p>

        </div>


    </main>


</body>

</html>
